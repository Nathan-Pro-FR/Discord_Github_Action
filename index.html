<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Galerie multimedia cyberpunk synchronisee avec Discord."
    />
    <title>Dark Neon Media Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">Cyberpunk Discord Gallery</h1>
      <p class="site-subtitle">
        Synchronisation automatique des medias d'un salon prive
      </p>
    </header>

    <main class="site-main">
      <section aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" class="section-title">Flux multimedia</h2>
        <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <small>Mis a jour automatiquement via GitHub Actions</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
